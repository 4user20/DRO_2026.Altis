# Copy to DROAI-config.cfg. Never commit real keys.
mode=OBSERVE
iniFolder=auto
pollIntervalMs=200
heartbeatMs=10000
maxQueue=8
maxSnapshotAgeSeconds=150
maxConsecutiveFailures=3
circuitOpenSeconds=300

# TACTICAL: frequent intent ranking (Laguna XS 2.1 or another cheap/fast API model)
tacticalBaseUrl=https://api.example.com/v1
tacticalApiKey=PUT_KEY_HERE
tacticalModel=poolside/Laguna-XS-2.1
tacticalTimeoutMs=20000
tacticalRetries=1
tacticalMaxTokens=450
tacticalTemperature=0.15
tacticalExtraBody={}

# STRATEGIC: rare operation-policy/blueprint call (NVIDIA NIM Nemotron or another reasoning model)
strategicBaseUrl=https://integrate.api.nvidia.com/v1
strategicApiKey=PUT_KEY_HERE
strategicModel=nvidia/nemotron-3-ultra-550b-a55b
strategicTimeoutMs=60000
strategicRetries=1
strategicMaxTokens=1400
strategicTemperature=0.2
strategicExtraBody={}

# NARRATIVE/FALLBACK: MiniMax or another OpenAI-compatible endpoint
narrativeBaseUrl=https://api.example.com/v1
narrativeApiKey=PUT_KEY_HERE
narrativeModel=minimax-model-id-from-provider
narrativeTimeoutMs=30000
narrativeRetries=1
narrativeMaxTokens=900
narrativeTemperature=0.4
narrativeExtraBody={}

# Optional fallback profile for tactical/strategic failures
fallbackProfile=narrative
mock=false
