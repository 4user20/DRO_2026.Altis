name: RC6 static validation

on:
  push:
    branches:
      - fix/post-merge-audit-hardening
    paths:
      - "dro2026/**"
      - "tools/**"
      - "docs/ARMA_WIKI_CONTEXT7_AUDIT.md"
      - ".github/workflows/rc6-static-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dro2026/**"
      - "tools/**"
      - "docs/ARMA_WIKI_CONTEXT7_AUDIT.md"
      - ".github/workflows/rc6-static-validation.yml"

permissions:
  contents: read

concurrency:
  group: rc6-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python and SQF contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements*.txt

      - name: Compile validators
        run: python -m py_compile tools/*.py

      - name: Run canonical RC6 validation
        run: python tools/validate_all_rc6.py
