name: Apply RC7 RPT runtime fixes

on:
  push:
    branches:
      - fix/rc7-rpt-fpv-support-runtime
    paths:
      - ".github/workflows/apply-rc7-rpt-runtime-fixes.yml"
      - ".bootstrap/rc7-rpt-fix.part*"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out runtime fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rc7-rpt-fpv-support-runtime

      - name: Verify and apply audited source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/rc7-rpt-fix.part* | base64 --decode > /tmp/rc7-rpt-fix.tar.xz
          echo "c2d503997ef78e9e4788c4c04d46bc7cd9ef98eef7ab86b7c03ed7e95124f9cf  /tmp/rc7-rpt-fix.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/rc7-rpt-fix.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-rc7-rpt-runtime-fixes.yml
          git diff --check
          python -m compileall -q tools
          python tools/validate_all_rc6.py

      - name: Commit clean runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rc7): repair FPV guidance, support catalog and runtime performance"
          git push origin HEAD:fix/rc7-rpt-fpv-support-runtime
