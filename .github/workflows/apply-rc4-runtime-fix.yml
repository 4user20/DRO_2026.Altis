name: Apply RC4 runtime fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/runtime-performance-drone-orchestration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-performance-drone-orchestration
          fetch-depth: 0

      - name: Detect unapplied payload
        id: payload
        shell: bash
        run: |
          if [[ -f tools/rc4_payload.tar.gz.b64 ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "RC4 payload already applied; nothing to do."
          fi

      - name: Expand reviewed RC4 source payload
        if: steps.payload.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf tools/rc4_payload.tar.gz.b64
          rm -f tools/rc4_payload.tar.gz.b64
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/validate_rc4.py')
          text = p.read_text()
          text = text.replace("root=Path('/mnt/data/worktree/DRO_2026.Altis')", "root=Path(__file__).resolve().parents[1]")
          p.write_text(text)
          PY

      - name: Static SQF validation
        if: steps.payload.outputs.apply == 'true'
        run: python3 tools/validate_rc4.py

      - name: Commit expanded RC4 implementation
        if: steps.payload.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize runtime and orchestrate drone support"
          git push origin HEAD:fix/runtime-performance-drone-orchestration
