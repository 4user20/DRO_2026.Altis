name: Apply RC4 runtime fix

on:
  push:
    branches:
      - fix/runtime-performance-drone-orchestration
    paths:
      - .github/workflows/apply-rc4-runtime-fix.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'fix/runtime-performance-drone-orchestration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-performance-drone-orchestration
          fetch-depth: 0

      - name: Expand reviewed RC4 source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/rc4_payload.tar.gz.b64 | tar -xz
          rm -f tools/rc4_payload.tar.gz.b64
          rm -f .github/workflows/apply-rc4-runtime-fix.yml

      - name: Static SQF validation
        run: python3 tools/validate_rc4.py

      - name: Commit expanded RC4 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize runtime and orchestrate drone support"
          git push origin HEAD:fix/runtime-performance-drone-orchestration
