name: Apply RC7.1 RPT fixes

on:
  push:
    branches:
      - fix/rc71-rpt-fpv-performance
    paths:
      - ".bootstrap/rc71xz.part*"
      - ".github/workflows/apply-rc71-rpt-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rc71-rpt-fpv-performance

      - name: Apply verified RPT stabilization patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/rc71xz.part* | base64 --decode > /tmp/rc71.patch.xz
          echo "59bc6386ceb26de8885f8c118e77bce7596ed4421bab35597a9bbf24bc49dd76  /tmp/rc71.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/rc71.patch.xz > /tmp/rc71.patch
          echo "bcfe037ba087227824732a1a0d876c28c4508313871c9ca4524519a38f37c730  /tmp/rc71.patch" | sha256sum --check --strict
          git apply --check /tmp/rc71.patch
          git apply /tmp/rc71.patch
          git rm .bootstrap/rc71xz.part* .github/workflows/apply-rc71-rpt-fixes.yml
          git diff --check
          python -m compileall -q tools
          python tools/validate_all_rc6.py

      - name: Commit final source-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rc7.1): stabilize FPV guidance, support catalog and runtime load"
          git push origin HEAD:fix/rc71-rpt-fpv-performance
