name: RC6 Validated Autofix Trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rc6-autofix-trigger.yml"
      - ".github/workflows/rc6-autofix-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc6-autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == '4user20/DRO_2026.Altis' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-merge-audit-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and apply validated patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/rc6-autofix-once.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          namespace = {"__name__": "__main__"}
          exec(compile(script, str(workflow), 'exec'), namespace)
          PY

      - name: Validate patched snapshot
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q tools
          python tools/validate_all_rc6.py

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rc6-autofix-once.yml
          rm .github/workflows/rc6-autofix-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce long-range launch materialization contracts"
          git push origin HEAD:fix/post-merge-audit-hardening
